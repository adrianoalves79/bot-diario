name: Monitorar Diario Oficial

on:
  schedule:
    - cron: "7,17,27,37,47,57 21-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber requests selenium webdriver-manager

      - name: Rodar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_diario.py

      - name: Salvar ultimo diario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultimo_diario.txt controle_dia.txt downloads/diario_atual.pdf || true
          git diff --cached --quiet || git commit -m "Atualiza ultimo diario"
          git push
